name: CI

on:
  push:
    branches: [main, develop, 'fix/**', 'feat/**', 'chore/**']
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - run: npm run test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_STORAGE_BUCKET: documents
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_LEGAL_MODEL: gpt-4.1-mini
      OPENAI_PDF_OCR_MODEL: gpt-4o
      OPENAI_PDF_OCR_ENABLED: 'true'
      OPENAI_OCR_MAX_PAGES: '25'
      OPENAI_EMBEDDING_MODEL: text-embedding-3-small
      PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
      PINECONE_INDEX_NAME: ace-openai
      PINECONE_NAMESPACE: legal-documents
      PINECONE_ARCHIVO_NAMESPACE: archivo-municipal
      PINECONE_EXPEDIENTES_NAMESPACE: expedientes-archivo
      RERANK_ENABLED: 'true'
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      COHERE_RERANK_MODEL: rerank-v3.5
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      CRON_SECRET: build-time-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - run: npm run build
